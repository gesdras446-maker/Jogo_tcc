<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background subtle grid pattern -->
    <pattern id="diagGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1b2229" fill-opacity="0.94"/>
      <rect x="0" y="0" width="10" height="10" fill="#151b21" fill-opacity="0.94"/>
      <rect x="10" y="10" width="10" height="10" fill="#151b21" fill-opacity="0.94"/>
    </pattern>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#boxShadow)">
    <!-- Top-Left Speaker Tab -->
    <path d="M 0 0 L 190 0 L 190 40 L 0 40 Z" fill="#0c1015" stroke="#2c3944" stroke-width="3"/>
    
    <!-- Main Outer Dialogue Box -->
    <rect x="0" y="38" width="796" height="178" rx="0" fill="url(#diagGrid)" stroke="#222b34" stroke-width="4"/>
    
    <!-- Inner Fine Blue-Grey Border Frame -->
    <rect x="14" y="52" width="768" height="150" fill="none" stroke="#486072" stroke-width="2" opacity="0.85"/>

    <!-- Bottom-Right Ornate Spiral / Swirl Icon -->
    <g transform="translate(752, 178) scale(0.95)" stroke="#527086" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M 0,0 
               A 3,3 0 0,1 3,3 
               A 6,6 0 0,1 -3,6 
               A 9,9 0 0,1 -9,-3 
               A 12,12 0 0,1 3,-9 
               A 15,15 0 0,1 15,3 
               A 18,18 0 0,1 -3,15"/>
    </g>
  </g>
</svg>
